name: Pet + Reward + Interaction + Care Validation

on:
  push:
    branches: [ pet-engine-v0.1, pet-assets-v0.2, pet-assets-v0.3, reward-engine-v0.1, pet-interaction-v0.1, kitchen-feeding-v0.1, garden-cleaning-v0.1, playroom-play-v0.1, pet-shop-progression-v0.1, pet-system-integration-v0.1, pet-art-runtime-v0.6, pet-art-ui-fix-v0.7, real-asset-integration-v0.8, pet-roaming-animation-v0.9, pets-dev ]
  workflow_dispatch:

concurrency:
  group: pet-reward-interaction-care-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Evelune Pets Dev identity
        shell: bash
        run: |
          sed -i 's/applicationId = "com.dk.evelune"/applicationId = "com.dk.evelune.petdev"/' app/build.gradle.kts
          sed -i 's/versionCode = 9/versionCode = 900/' app/build.gradle.kts
          sed -i 's/versionName = "0.9.0"/versionName = "0.9.0-petdev"/' app/build.gradle.kts
          sed -i 's#<string name="app_name">Evelune</string>#<string name="app_name">Evelune Pets Dev</string>#' app/src/main/res/values/strings.xml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify app still compiles
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload integrated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Evelune-Pets-Dev-v0.9.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
